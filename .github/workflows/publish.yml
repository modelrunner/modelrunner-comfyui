name: Publish to Comfy Registry

# Publishes only when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# The tag must match pyproject.toml's version; the Registry refuses a version it already has.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository_owner == 'modelrunner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag matches pyproject.toml
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - name: Ship gate
        env:
          MODELRUNNER_DENYLIST: ${{ secrets.MODELRUNNER_DENYLIST }}
        run: python3 scripts/check_pack.py
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main, 2025-05-10
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
