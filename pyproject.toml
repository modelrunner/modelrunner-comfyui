[project]
name = "modelrunner"
description = "Run hundreds of image, video, audio and 3D AI models from ComfyUI with one ModelRunner API key: one typed node per model, plus a run-any-model node."
version = "0.2.4"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = ["Operating System :: OS Independent"]
dependencies = []

[project.urls]
Homepage = "https://modelrunner.ai/comfyui"
Repository = "https://github.com/modelrunner/modelrunner-comfyui"
Documentation = "https://modelrunner.ai/docs"
"Bug Tracker" = "https://github.com/modelrunner/modelrunner-comfyui/issues"

[tool.comfy]
PublisherId = "modelrunner"
DisplayName = "ModelRunner"
Icon = "https://raw.githubusercontent.com/modelrunner/modelrunner-comfyui/main/assets/icon.png"
requires-comfyui = ">=0.12.1"
includes = []
